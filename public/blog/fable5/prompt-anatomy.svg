<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="560" fill="#FAF7F0"/>
  <rect x="0.5" y="0.5" width="959" height="559" fill="none" stroke="#1A1A1A" stroke-opacity="0.12"/>
  <text x="48" y="56" font-size="13" letter-spacing="4" fill="#A8451F" font-weight="700">STRUCTURE</text>
  <text x="48" y="92" font-size="30" fill="#1A1A1A" font-weight="800">Anatomy of a master prompt</text>
  <text x="48" y="118" font-size="15" fill="#3A3A36">Every one of the 40 prompts uses the same five parts — steal the skeleton.</text>

  <g>
    <rect x="48" y="148" width="864" height="64" fill="#F2EFE6" stroke="#C66B3F" stroke-width="1"/>
    <rect x="48" y="148" width="4" height="64" fill="#C66B3F"/>
    <text x="72" y="175" font-size="14" fill="#A8451F" font-weight="700" letter-spacing="2">ROLE</text>
    <text x="72" y="197" font-size="15" fill="#1A1A1A">"You are a staff engineer who onboards new developers…" — sets the quality bar.</text>
  </g>
  <g>
    <rect x="48" y="224" width="864" height="64" fill="#F2EFE6" stroke="#C66B3F" stroke-width="1"/>
    <rect x="48" y="224" width="4" height="64" fill="#C66B3F"/>
    <text x="72" y="251" font-size="14" fill="#A8451F" font-weight="700" letter-spacing="2">GOAL</text>
    <text x="72" y="273" font-size="15" fill="#1A1A1A">One outcome, not a task list. Fable 5 plans better than you micro-manage.</text>
  </g>
  <g>
    <rect x="48" y="300" width="864" height="64" fill="#F2EFE6" stroke="#C66B3F" stroke-width="1"/>
    <rect x="48" y="300" width="4" height="64" fill="#C66B3F"/>
    <text x="72" y="327" font-size="14" fill="#A8451F" font-weight="700" letter-spacing="2">CONTEXT</text>
    <text x="72" y="349" font-size="15" fill="#1A1A1A">Paste the real thing — repo tree, workflow JSON, client email. Never describe what you can paste.</text>
  </g>
  <g>
    <rect x="48" y="376" width="864" height="64" fill="#F2EFE6" stroke="#C66B3F" stroke-width="1"/>
    <rect x="48" y="376" width="4" height="64" fill="#C66B3F"/>
    <text x="72" y="403" font-size="14" fill="#A8451F" font-weight="700" letter-spacing="2">CONSTRAINTS</text>
    <text x="72" y="425" font-size="15" fill="#1A1A1A">What it must NOT do — scope fences beat wish lists.</text>
  </g>
  <g>
    <rect x="48" y="452" width="864" height="64" fill="#F2EFE6" stroke="#C66B3F" stroke-width="1"/>
    <rect x="48" y="452" width="4" height="64" fill="#C66B3F"/>
    <text x="72" y="479" font-size="14" fill="#A8451F" font-weight="700" letter-spacing="2">OUTPUT FORMAT</text>
    <text x="72" y="501" font-size="15" fill="#1A1A1A">Markdown file? Table? JSON? Say so — Fable 5 holds the format across very long outputs.</text>
  </g>
</svg>
